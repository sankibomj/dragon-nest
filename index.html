<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Драконье Гнездо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Philosopher:wght@700&display=swap">
<style>
/* Layout: phone-width column. Sticky top bar (bank, era counter, currencies), scrolling screen, six-tab bar at the bottom.
   Look: one committed dark world, bronze plates and ember glow on near-black; dragons and eggs carry the colour. */
:root{
  color-scheme:dark;
  --bg:#07080b; --panel:#100e0d; --panel2:#1a1511; --edge:#5a4733; --edge-hi:#a8844f;
  --ink:#f3ecdf; --muted:#a39682; --ember:#ff8a2a; --gold:#f0b43c; --good:#46b46a; --bad:#e2574c;
  --violet:#a07bff; --salmon:#ff8f86; --hud:#0b0a0a;
  --display:'Philosopher',Georgia,'Times New Roman',serif;
  --body:'Merriweather',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:contain}
body{background:radial-gradient(120% 55% at 50% 0%,#241811 0%,transparent 62%),radial-gradient(90% 40% at 50% 100%,#341708 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:13px/1.5 var(--body);min-height:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud)}
.in{max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3,p{margin:0}
em{font-style:normal}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;flex:none}

/* top bar */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(#0d0b0a,#0a0908);border-bottom:1px solid #2c2219}
.hud .in{padding-block:8px;display:grid;gap:8px}
.row1{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center;text-align:center}
.gear{width:38px;height:38px;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px}
.gear .ic{width:100%;height:100%}
.stat{display:grid;gap:1px;min-width:0}
.stat b{font:700 13px/1.2 var(--display);color:#d9c9ab;letter-spacing:.02em}
.stat span{font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap}
.cur{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.cs{display:flex;align-items:center;gap:6px;color:var(--gold);font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;padding-right:6px}
.cs .ic{width:28px;height:28px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--edge);background:linear-gradient(#1a1511,#0e0b09);color:#f7e4bd;font:700 13px/1 var(--body);font-variant-numeric:tabular-nums;cursor:pointer;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);min-width:0}
.cbtn .ic{color:var(--gold);width:18px;height:18px}
.cbtn i{font:700 17px/1 var(--body);color:var(--ember);font-style:normal}

/* plates and cards */
.plate{display:grid;gap:2px;justify-items:center;align-content:center;min-height:46px;padding:6px 12px;border:0;border-radius:3px;color:#fff4e4;font:700 11.5px/1.15 var(--body);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.7);
  background:linear-gradient(#cf7a42,#8f4521);box-shadow:inset 0 0 0 1px #eaa56e,inset 0 0 0 3px #6b3216,0 0 0 1px #2b140a,0 2px 6px rgba(0,0,0,.6)}
.plate.g{background:linear-gradient(#3d9c5b,#1f6035);box-shadow:inset 0 0 0 1px #7bd49c,inset 0 0 0 3px #164a28,0 0 0 1px #0b2214,0 2px 6px rgba(0,0,0,.6)}
.plate.p{background:linear-gradient(#7a52d6,#43257f);box-shadow:inset 0 0 0 1px #b79bff,inset 0 0 0 3px #32195f,0 0 0 1px #150a2c,0 2px 6px rgba(0,0,0,.6)}
.plate.sm{min-height:36px;padding:4px 8px;font-size:10.5px}
.plate.wide{width:100%}
.plate small{font:700 12px/1 var(--body);display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.plate:disabled{filter:grayscale(.9) brightness(.65);cursor:default}
.plate:not(:disabled):active{transform:translateY(1px)}
.bevel{--c:14px;background:var(--edge);padding:1px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,0 100%,0 var(--c))}
.bevel>.bi{background:linear-gradient(#14110f,#0c0a09);clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,0 100%,0 var(--c));padding:14px;display:grid;gap:10px;min-width:0}
.bevel.flat>.bi{padding:0;gap:0}

main{padding-top:6px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font:700 19px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em}
.sec .ic{color:var(--edge-hi);width:18px;height:18px}
.sec .sp{flex:1}
.note{font-size:12px;color:var(--muted);max-width:60ch}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;text-align:left}
.warn .ic{color:var(--bad);width:18px;height:18px;margin-top:1px}
.err{padding:12px;border:1px solid var(--bad);color:var(--bad)}
.t2{display:flex;justify-content:space-around;gap:6px;margin:10px 0 12px;border-bottom:1px solid #2c2219}
.t2 button{flex:1;background:none;border:0;padding:12px 4px;font:700 13px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#cdbfa6;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.t2 button[aria-selected="true"]{color:#e9ad63;border-bottom-color:#e9ad63}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:700 13px/1 var(--body);padding:10px 0;cursor:pointer}

/* home */
.isles{position:relative;aspect-ratio:360/450;margin-top:2px}
.isles>svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;background:none;border:0;padding:0 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;cursor:pointer;text-shadow:0 2px 8px #000,0 0 3px #000}
.hot b{font:700 clamp(17px,5.8vw,25px)/1 var(--display);letter-spacing:.04em;color:#f6efe2}
.hot .chips{display:flex;gap:10px;font-size:11px;font-weight:700;flex-wrap:wrap;justify-content:center}
.hot .chips span{display:flex;align-items:center;gap:3px}
.hot.castle{left:14%;top:8%;width:72%;height:48%}
.hot.altar{left:2%;top:56%;width:46%;height:40%}
.hot.nest{left:50%;top:58%;width:48%;height:38%}
.side{position:absolute;top:14%;display:grid;gap:12px}
.side.l{left:0}.side.r{right:0}
.round{width:62px;display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;font:700 11px/1.1 var(--body);text-shadow:0 1px 4px #000;color:#f3ecdf}
.round i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#1a1410,#050404);border:2px solid #7c6240;box-shadow:0 0 12px rgba(255,138,42,.25),inset 0 0 8px #000;font-style:normal;color:#f2e6cf}
.round i .ic{width:30px;height:30px}

/* scenes and unit cards */
.banner{position:relative;line-height:0}
.banner svg{display:block;width:100%;height:auto}
.banner .tag{position:absolute;left:8px;top:8px;line-height:1.2;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.65);border:1px solid #4a3a2a;font:700 10.5px/1.3 var(--body);text-transform:uppercase;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.ub{display:grid;gap:10px;text-align:center;justify-items:center;padding:14px}
.ub h3{font:700 19px/1.2 var(--body);font-variant-numeric:tabular-nums}
.ub .eph{color:var(--salmon);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.qty{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qty button{min-width:52px;min-height:32px;padding:0 10px;border:1px solid var(--edge);background:#14100d;color:#d9c9ab;font:700 12px/1 var(--body);cursor:pointer}
.qty button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.btn1{width:100%;max-width:300px}

/* rows with art tile */
.cardrow{display:grid;grid-template-columns:104px minmax(0,1fr);min-width:0}
.tile{display:grid;place-items:center;min-height:132px;background:radial-gradient(circle at 50% 60%,var(--tc,#5a2a16),#0b0907 80%);color:#f6e7c8;border-right:1px solid #2c2219}
.tile .ic{width:54px;height:54px}
.cbody{display:grid;gap:8px;padding:12px;align-content:center;justify-items:center;text-align:center;min-width:0}
.cbody h3{font:700 16px/1.25 var(--body)}
.cbody p{font-size:11.5px;color:var(--muted)}
.cbody .pair{gap:8px}
.status{display:grid;place-items:center;min-width:64px;padding:6px;border:1px solid #3a2e22;background:#0a0807;font:700 10.5px/1.2 var(--body);text-transform:uppercase;color:#cdbfa6;text-align:center}
.status b{font:700 17px/1.1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.lockrow{position:relative}
.cardrow.locked .tile{filter:grayscale(1) brightness(.6)}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:4px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--p,50%),#6e675c var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#6e675c}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(#ffe38a,#d69a22);border:2px solid #fff3c4;margin-top:-7px;box-shadow:0 0 6px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:radial-gradient(#ffe38a,#d69a22);border:2px solid #fff3c4}
.bal{font:700 24px/1.2 var(--body);text-align:center;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:8px}
.bal .ic{color:var(--gold);width:28px;height:28px}
.pct{text-align:center;color:var(--muted);font-size:12px}

/* lists */
.rv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid #2a2017}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--body);color:#fff;border:2px solid #5a4733;text-shadow:0 1px 2px #000}
.rb{display:grid;gap:5px;min-width:0}
.rb b{font:700 15px/1.2 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .st{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rb .st span{display:inline-flex;gap:4px;align-items:center}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini i{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:#0a0807;border:1px solid #3a2e22;color:var(--ember)}
.mini i.c{color:var(--violet)}
.mini .ic{width:15px;height:15px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.acts .plate{flex:1 1 84px}
.pop{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pop button{flex:1 1 auto;min-height:32px;padding:0 8px;border:1px solid var(--edge);background:#14100d;font:700 11px/1.2 var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.pop button:disabled{opacity:.4}
.tag2{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid #4a3a2a;font:700 10px/1.4 var(--body);color:var(--muted);text-transform:uppercase}
.rk{font:700 14px/1 var(--body);color:var(--muted);align-self:center}
.me{background:rgba(255,138,42,.07)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;min-height:42px;padding:0 12px;background:#0b0908;border:1px solid var(--edge);color:var(--ink);font:13px var(--body)}
.search input::placeholder{color:#7d705d}
.clan{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid #2a2017}
.crest{width:44px;height:56px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);display:grid;place-items:center;font:700 11px/1.1 var(--display);text-align:center;color:#fff;padding:4px}
.clan h3{font:700 14px/1.25 var(--body);text-transform:uppercase}
.clan p{font-size:12px;color:var(--muted)}
.clan .st{display:flex;gap:12px;flex-wrap:wrap;margin:3px 0;font-size:12px;font-weight:700}
.clan .st span{display:inline-flex;gap:4px;align-items:center}
.logs{display:grid;gap:6px}
.logs p{font-size:12px;color:#cdbfa6;padding:6px 8px;border-left:2px solid #4a3a2a;background:#0b0908}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shopc{display:grid;gap:8px;justify-items:center;text-align:center;padding:12px 8px;min-width:0}
.shopc .ico{width:84px;height:84px;display:grid;place-items:center;color:#f4a24a}
.shopc .ico .ic{width:70px;height:70px}
.shopc.cu .ico{color:var(--violet)}
.shopc h3{font:700 14px/1.25 var(--body)}
.shopc p{font-size:11px;color:var(--muted);min-height:2.6em}
.card2{position:relative;display:grid;gap:6px;justify-items:center;text-align:center;padding:12px 8px 10px;border:1px solid #3a2e22;background:linear-gradient(#120f0d,#0b0908);min-width:0}
.card2 .ico{width:78px;height:78px;display:grid;place-items:center;color:#f4a24a}
.card2 .ico .ic{width:62px;height:62px}
.card2.cu .ico{color:var(--violet)}
.card2 h3{font:700 13px/1.25 var(--body)}
.card2 p{font-size:10.5px;color:var(--muted)}
.card2 .bd{position:absolute;right:6px;top:6px;min-width:34px;padding:3px 6px;border-radius:999px;border:1px solid #b9753a;background:#1a0f08;color:#ffb36b;font:700 12px/1 var(--body);font-variant-numeric:tabular-nums}
.card2 .on{position:absolute;left:6px;top:6px;padding:3px 7px;border-radius:999px;background:#000;border:1px solid #4a3a2a;font:700 9.5px/1.2 var(--body);text-transform:uppercase}
.prof{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;align-items:center}
.hexav{width:78px;height:88px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#6aa39a;display:grid;place-items:center;font:700 24px/1 var(--body);color:#eaf7f3}
.prof h3{font:700 17px/1.2 var(--body);grid-column:2}
.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pstats span{display:flex;gap:5px;align-items:center;white-space:nowrap}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:8px 0 4px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chipbar button{flex:none;min-height:36px;padding:0 18px;border-radius:18px;border:1px solid #3a2e22;background:#17120f;font:700 12px/1 var(--body);color:#d9c9ab;cursor:pointer;text-transform:uppercase}
.chipbar button[aria-pressed="true"]{border-color:#caa36a;color:#f2d9a8;background:#241a12}
.bar{height:8px;background:#26201a;border-radius:4px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c8791f,var(--gold));border-radius:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:grid;gap:3px;justify-items:center;padding:8px 2px;border:1px solid #3a2e22;background:#0b0908;font-size:10px;text-align:center;color:var(--muted)}
.day b{font:700 12px/1 var(--body);color:var(--ink)}
.day.now{border-color:var(--ember)}
.day.done{opacity:.45}
.task{display:grid;gap:8px}
.task h3{font:700 14px/1.3 var(--body)}
.task .rw{font-size:12px;color:var(--gold)}
.war{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(120deg,#8b2a18,#c4503a);border:0;width:100%;text-align:left;cursor:pointer;color:#fff;margin-bottom:10px}
.war small{display:block;font-size:12px;opacity:.85}
.war b{font:700 19px/1.15 var(--display);text-transform:uppercase}
.war .sp{flex:1}
.sc{display:flex;gap:8px;flex-wrap:wrap}
.sc button{flex:1 1 70px;min-height:42px;border:1px solid var(--edge);background:#14100d;font:700 13px/1 var(--body);cursor:pointer}
.sc button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed #2a2017}
.kv b{font-variant-numeric:tabular-nums}
.hint p{font-size:12.5px;max-width:60ch}
.info p{font-size:12.5px;color:#d9ceba;margin-bottom:8px;max-width:62ch}
.info b{color:var(--gold)}

.act{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rb .act{margin:4px 0 0}
.act:empty{display:none}
.act span{display:inline-flex;gap:5px;align-items:center;padding:3px 8px;border:1px solid #4a3a2a;background:#0a0807;font:700 11px/1.3 var(--body);color:#f2d9a8}
.act .ic{width:14px;height:14px;color:inherit}
.act.ico span{border:0;background:none;padding:0}
.act.ico .ic{width:22px;height:22px}
/* bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(#0d0b0a,#070606);border-top:1px solid #2c2219;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding-block:6px}
.tab{position:relative;display:grid;gap:3px;justify-items:center;align-content:center;min-height:56px;border:0;background:none;color:#e7dcc6;font:700 10px/1.1 var(--body);cursor:pointer;min-width:0;padding:0}
.tab .ic{width:26px;height:26px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
.tab .ic{position:relative;z-index:1}
.tab[aria-selected="true"]{color:var(--ember)}
.tab[aria-selected="true"]::before,.tab[aria-selected="true"]::after{content:"";position:absolute;clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%)}
.tab[aria-selected="true"]::before{inset:-4px -6px;background:var(--ember);opacity:.9}
.tab[aria-selected="true"]::after{inset:-3px -5px;background:linear-gradient(#1b110b,#090605)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:calc(100% - 32px);padding:9px 14px;background:#f1e6d0;color:#1a120b;font:700 12.5px/1.35 var(--body);border:1px solid #a8844f;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fs{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer;--fc:#ff8a2a;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--fc) 38%,#000) 0,#050304 78%)}
.fs.on{display:flex;animation:fsin .35s ease-out}
.fs[data-kind="era1"]{--fc:#46b46a}
.fs[data-kind="era2"]{--fc:#ff8a2a}
.fs[data-kind="era3"]{--fc:#e2574c}
.fs[data-kind="atk"]{--fc:#e2574c}
.fs[data-kind="def"]{--fc:#4f8fd6}
.fs[data-kind="curse"]{--fc:#9b4fd6}
.fs[data-kind="denom"]{--fc:#f0b43c}
.fs-in{max-width:420px;display:grid;gap:14px;justify-items:center}
.fs-k{font:700 13px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--fc)}

function migrate(x){
  const f=fresh();
  if(!x||typeof x!=='object'||x.v!==8){initSeason(f);return f;}
  const s=Object.assign(f,x);
  s.boost=Object.assign({birth:0,atk:0,def:0,eye:0},x.boost||{});
  s.sb=Object.assign({b3:0,a3:0,d3:0,panic:0,calm:0},x.sb||{});
  s.st=Object.assign(fresh().st,x.st||{});
  ['deb','inv','arts','tc','artR','own'].forEach(k=>{s[k]=x[k]&&typeof x[k]==='object'?x[k]:{};});
  s.daily=Object.assign({last:'',streak:0},x.daily||{});
  if(!Array.isArray(s.rivals)||!s.rivals.length||!Array.isArray(s.clans)){initSeason(s);}
  s.speed=1;
  s.cb=Object.assign({birth:0,atk:0,def:0},x.cb||{});
  s.lbt=(Array.isArray(x.lbt)?x.lbt:[]).map(n=>n>0?Math.floor(n):0).concat([0,0,0,0,0]).slice(0,5);
  s.ch=x.ch&&typeof x.ch==='object'?x.ch:{};
  s.chu=Object.assign({rev:0,sav:0,agr:0},x.chu||{});
  if(x.bankV!==2){s.bank=0;s.sky=0;s.bankV=2;}
  {const keep=[];let nc=-1;s.clans.forEach((c,i)=>{if(c&&typeof c.desc==='string'&&c.desc.indexOf('Новый клан')===0){if(i===s.clan)nc=keep.length;keep.push(c);}});s.clans=keep;s.clan=nc;}
  if(!s.war||s.war.e>=s.clans.length||s.war.e===s.clan)s.war={e:-1,a:0,b:0};
  if(!(s.campP>=CAMP_MIN))s.campP=CAMP_MIN;if(!(s.denom>=1))s.denom=1;if(!(s.camp>=0))s.camp=0;
  if(!(s.rt>0))s.rt=Date.now();
  return s;
}

const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const SUF=['','K','M','B','T','Qa','Qi'];
function fmtC(n){
  if(!isFinite(n))return '∞';
  n=Math.floor(Math.max(0,n)+1e-9);
  if(n<1000)return String(n);
  let i=0,v=n;while(v>=1000&&i<SUF.length-1){v/=1000;i++;}
  return (v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2)).replace('.',',')+SUF[i];
}
function fmt(n){if(!isFinite(n))return '∞';n=Math.floor(Math.max(0,n)+1e-9);return n>=1e9?fmtC(n):nf.format(n);}
function fmtD(gms){
  const s=Math.max(0,Math.ceil(gms/(1000*TS*S.speed))),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0');
}

let bigQ=[],bigCur=null,bigTimer=0,bigMute=false;
function bigMsg(kind,title,text,sub,ms){
  if(bigMute&&(kind==='atk'||kind==='curse'||kind==='def'))return;
  if(bigMute&&kind.indexOf('era')===0)bigQ=bigQ.filter(x=>x.kind.indexOf('era')!==0);
  bigQ.push({kind:kind,title:title,text:text||'',sub:sub||'',ms:ms||4500});
  if(bigQ.length>4)bigQ.shift();
  if(!bigCur)bigNext();
}
function bigNext(){
  const el=document.getElementById('fs');if(!el)return;
  const m=bigQ.shift();
  if(!m){bigCur=null;el.classList.remove('on');return;}
  bigCur=m;el.dataset.kind=m.kind;
  document.getElementById('fsk').textContent=m.kind==='denom'?'Деноминация':m.kind.indexOf('era')===0?'Новая эра':m.kind==='curse'?'Порча':m.kind==='def'?'Защита':'Нападение';

  document.getElementById('fsp').textContent=m.text;
  document.getElementById('fss').textContent=m.sub;

}

function birthMult(){
  let m=S.gb;
  if(on(S.boost.birth))m*=1.5;
  if(S.clan>=0&&on(S.cb.birth))m*=1.25;
  if(S.inv.lotus>0)m*=1.5;
  if(on(S.sb.b3))m*=3;
  if(A('staff'))m*=2;
  if(A('fountain')){const e=effEra();if(e===1)m*=5;else if(e===2)m*=2;}
  if(on(S.deb.lotus||0))m*=0.5;
  if(S.chu.rev>0)m*=Math.pow(3,S.chu.rev);
  return m;
}
function atkMult(){
  let m=1;
  if(A('sword'))m*=2;if(S.clan>=0&&on(S.cb.atk))m*=1.25;if(S.inv.blade>0)m*=1.5;if(on(S.boost.atk))m*=1.5;if(on(S.sb.a3))m*=3;if(on(S.deb.blade||0))m*=0.5;

const rD=r=>Math.floor(r.d*r.dr*(r.inv.amulet>0?1.5:1)*(on(r.deb.amulet||0)?0.5:1));
const clanD=i=>{let w=S.clan===i?S.dragons:0;for(const r of S.rivals)if(r.clan===i)w+=r.d;return w;};

/* --- деноминация: когда в мире слишком много драконов, все числа делятся на 1000 --- */
function catMin(){return CAT_BASE/S.denom;}
function denominate(){
  const k=DENOM_K;
  S.dragons/=k;S.eggs/=k;S.hunters/=k;S.defenders/=k;S.altar/=k;S.camp/=k;S.catN/=k;S.w2/=k;S.w3/=k;
  if(!S.dead&&S.dragons>0&&S.dragons<1)S.dragons=1;
  S.rivals.forEach(r=>{r.d/=k;r.eggs=(r.eggs||0)/k;if(!r.dead&&r.d<1)r.d=1;});
  S.denom*=k;
  addLog('Деноминация: числа драконов, яиц и войск уменьшены в '+nf.format(k)+' раз (всего ×'+fmt(S.denom)+').');
  toast('Деноминация: числа уменьшены в '+nf.format(k)+' раз');
  bigMsg('denom','Деноминация','Числа драконов, яиц, охотников, защитников, алтаря, лагеря и порогов эр уменьшены в '+nf.format(k)+' раз. Ваша доля в мире не изменилась.','',6000);
  needRender=true;
}

/* --- артефакты: цена падает до минимальной за 3 часа после конца таймера --- */
function artMins(k){const a=S.artR[k];if(!a)return 0;if(on(a.until))return a.mins||0;return Math.max(0,(a.mins||0)*(1-(S.gt-a.until)/ART_DECAY));}
function artCost(k){return k==='claws'?5*ART_PRICE:Math.ceil(ART_PRICE*(artMins(k)+1));}

/* --- лагерь драконов --- */
function campGap(){ // отрыв игрока от 2 места (1,0 = 100%); -1, если игрок не первый
  const al=S.rivals.filter(r=>!r.dead);if(!al.length||S.dragons<1)return -1;
  let b=1;for(const r of al)if(r.d>b)b=r.d;
  return S.dragons>b?S.dragons/b-1:-1;
}
function campShare(){const g=campGap();return g<=0?0:Math.min(0.95,0.9*Math.log(1+g)/Math.log(11));} // отрыв 1000% = 90%
const campCost=()=>Math.ceil(S.campP);
function skipN0(){return S.skipN>0&&on(S.skipReset)?S.skipN:0;}
const skipCost=()=>SEAL0*Math.pow(SEAL_X,skipN0());

/* ================= ход времени ================= */
function tick(dtG){
  const gh=dtG/3600,ms=dtG*1000;
  S.gt+=ms;
  S.campP=Math.max(CAMP_MIN,CAMP_MIN+(S.campP-CAMP_MIN)*Math.exp(-CAMP_DECAY*(S.campP/CAMP_MIN)*gh));
  let w=world();if(w>=DENOM_AT){denominate();w=world();}
  if(S.era<2&&w>=S.w2){S.era=2;addLog('Началась 2 эра. Теперь можно атаковать других игроков.');toast('Началась 2 эра: открыты атаки');eraMsg(2);needRender=true;}
  if(S.blk&&w<S.w3)S.blk=false;
  if(S.era<3&&w>=S.w3&&!S.blk){S.era=3;S.cat0=S.gt;S.catNext=S.gt+CAT_STEP;addLog('Началась 3 эра. Начался катаклизм, драконы вымирают.');toast('Началась 3 эра: катаклизм!');eraMsg(3);needRender=true;}
  if(S.era===3&&!on(S.noCat)){
    if(!(S.catNext>0))S.catNext=S.gt+CAT_STEP;
    if(S.gt>=S.catNext){catGrow();S.catNext=S.gt+CAT_STEP;}
  }
  if(effEra()!==3)S.eggs+=S.dragons*BIRTH*birthMult()*gh;
  const f=catRate();
  if(f>0&&S.dragons>0){
    if(f*gh>=S.dragons)S.dAt=S.gt-ms*(1-S.dragons/(f*gh));
    const lost=Math.min(S.dragons,f*gh),fr=lost/S.dragons;
    S.dragons-=lost;S.eggs*=1-fr*0.5;S.hunters*=1-fr*0.3;S.defenders*=1-fr*0.3;
  }
  if(S.era===3&&on(S.noCat))S.cat0+=ms;
  if(!S.dead&&S.dragons<1){S.dragons=0;S.eggs=0;S.dead=true;S.deadAt=S.dAt||S.gt;addLog('У вас не осталось драконов. Вы погибли.');needRender=true;}
  const gg=catGlobal();
  const bm=(botHas('staff')?2:1)*(botHas('fountain')?(effEra()===1?5:effEra()===2?2:1):1);
  for(const r of S.rivals){
    if(r.dead)continue;
    if(effEra()!==3)r.eggs=(r.eggs||0)+r.d*BIRTH*S.gb*gh;
    if(gg>0){const k=gg*r.sv*(r.inv.sphere>0?0.666:1)*gh;if(k>=r.d)r.dAt=S.gt-ms*(1-r.d/k);r.d-=k;}
    else r.d*=Math.exp(r.g*S.gb*bm*(on(r.deb.lotus||0)?0.5:1)*gh);
    if(r.d<1){if(gg>0){r.d=0;r.dead=true;r.deadAt=r.dAt||S.gt;addLog('Дракон-бот погиб.');needRender=true;}else r.d=1;}
  }
  if(S.gt>=S.botNext){S.botNext=S.gt+90000+rnd(120000);botAI();}
  
  for(const c of S.clans)c.pool*=Math.exp(0.02*gh);
  if(effEra()===2){
    if(S.gt>=S.nextRaid){rivalRaid();S.nextRaid=S.gt+(0.5+Math.random())*GH;}
    S.war.b+=gh*(0.5+Math.random());
  }
  if(S.gt>=S.nextPay)payout();
  if(S.dead&&S.rivals.every(r=>r.dead))endSeason();
}
function catGrow(){
  // чем меньше драконов в мире относительно порога 3 эры, тем сильнее рост
  const q=S.w3>0?Math.min(1,Math.max(0,world()/S.w3)):1;
  const k=CAT_GROW_MIN+(CAT_GROW_MAX-CAT_GROW_MIN)*(1-q);
  S.catN=Math.min(CAT_MAX/S.denom,S.catN*(1+k));
  addLog('Катаклизм усилился на '+Math.round(k*100)+'%: '+fmtC(S.catN)+' драконов в час');
  toast('Катаклизм усилился: '+fmtC(S.catN)+' в час');needRender=true;
}
function botAI(){
  const r=S.rivals[0];if(!r||r.dead)return;
  r.wings=(r.wings||0)+1.5e6;r.gold=(r.gold||0)+30;
  for(const k in BOWN)if(botHas(BOWN[k])&&Math.random()<(S.gbOpen[k]?0.1:0.5)){S.gbOpen[k]=S.gbOpen[k]?0:1;needRender=true;addLog('Бот '+(S.gbOpen[k]?'открыл':'закрыл')+' буст «'+GB[k].n+'»');}
  const ks=Object.keys(ARTS).filter(k=>S.era>=ARTS[k].era),k=ks[rnd(ks.length)],a=S.artR[k],act=a&&on(a.until);
  if(act&&a.who==='me')return;
  if(k==='claws'){if(act||r.wings<5*ART_PRICE)return;r.wings-=5*ART_PRICE;bankIn(5*ART_PRICE);S.artR[k]={who:'bot',until:S.gt+300000,mins:5};needRender=true;return;}
  const mins=artMins(k),cost=Math.ceil(ART_PRICE*(mins+1));
  if(r.wings<cost)return;
  r.wings-=cost;bankIn(cost);S.artR[k]={who:'bot',until:(act?a.until:S.gt)+60000,mins:mins+1};needRender=true;
}
function step(){
  const now=Date.now();
  if(S.breakUntil){
    S.rt=now;
    if(now>=S.breakUntil){S.breakUntil=0;S.season++;initSeason(S);ui.panel=null;ui.targets=[];needRender=true;dirty=true;eraMsg(1,'Сезон '+S.season);}
    return;
  }
  let rdt=(now-S.rt)/1000;S.rt=now;
  if(!(rdt>0))return;
  const away=rdt>6;
  let gdt=away?Math.min(rdt*TS,10*3600):rdt*TS*S.speed;
  if(away)toast('Пока вас не было, прошло '+(gdt/3600).toFixed(1).replace('.',',')+' игровых часа');
  const n=Math.max(1,Math.ceil(gdt/120)),sub=gdt/n;
  const era0=S.season;
  bigMute=away;
  for(let i=0;i<n;i++){tick(sub);if(S.breakUntil)break;}
  bigMute=false;
  botAcc+=Math.min(rdt,60);
  if(A('bot')&&botAcc>=15){
    botAcc=0;if(S.botOn===0)return;hatch(true);
    ['birth','def','atk'].forEach(k=>{const g=GB[k];if(!on(S.boost[k])&&!isClosed(k)&&S.era>=g.era&&S.gold>=g.cost){S.gold-=g.cost;S.boost[k]=S.gt+g.dur;needRender=true;}});
  }
}
function payout(){
  S.nextPay=S.gt+PAY_EVERY;
  const pool=S.bank*0.03;S.bank-=pool;
  const w=world();const shr=w>0?S.dragons/w:0;let got=Math.floor(pool*shr)+Math.floor(S.sky*shr);S.sky=0;
  if(S.clan>=0){const c=S.clans[S.clan],cd=clanD(S.clan),cp=c.pool*0.5;c.pool-=cp;got+=Math.floor(cp*(cd>0?S.dragons/cd:0));}
  S.clans.forEach((c,i)=>{if(i!==S.clan)c.pool*=0.6;});
  S.wings+=got;addLog('Выплата Даров небес: +'+fmt(got));toast('Выплата Даров небес: +'+fmtC(got));needRender=true;
}
function rivalRaid(){
  if(S.dead)return;
  const c=S.rivals.filter(r=>!r.dead&&rH(r)>0);if(!c.length)return;
  const r=c[rnd(c.length)];
  if(A('cloak')){addLog('Плащ невидимости скрыл вас от атаки '+r.n);bigMsg('def','Атака сорвана',r.n+' пытался напасть, но Плащ невидимости скрыл вас.');return;}
  if(on(S.imm)){addLog('Иммунитет защитил вас от атаки '+r.n);bigMsg('def','Атака сорвана',r.n+' пытался напасть, но Иммунитет защитил вас.');return;}
  const ap=rH(r),dp=S.defenders*defMult(),claws=botHas('claws'),tot=ap+dp,share=tot>0?ap/tot:1;
  r.hr*=1-0.4*(1-share);S.defenders=Math.floor(S.defenders*(1-0.4*share));
  if(ap>dp||claws){
    const sh=claws?1:share,lost=Math.floor(S.dragons*0.16*sh),eg=Math.floor(S.eggs*(claws?1:0.5*sh));S.dragons-=lost;S.eggs-=eg;r.eggs=(r.eggs||0)+eg;S.imm=S.gt+immMs();S.war.b+=1;
    let msg=r.n+' победил вас: −'+fmtC(lost)+' драконов, −'+fmtC(eg)+' яиц',curseTxt='';
    if(Math.random()<0.35){
      const k=Object.keys(CURSES)[rnd(6)],cu=CURSES[k];
      if(S.inv[cu.t]>0){S.inv[cu.t]=0;curseTxt='Порча «'+cu.n+'» сняла ваш буст';msg+='. «'+cu.n+'» сняла ваш буст';}
      else{S.deb[cu.t]=S.gt+DEB_DUR;curseTxt='На вас наложена порча «'+cu.n+'»: '+cu.d;msg+='. На вас наложена порча «'+cu.n+'»';}
    }
    addLog(msg);toast(msg);needRender=true;
    bigMsg(curseTxt?'curse':'atk',curseTxt?'На вас напали и наслали порчу!':'На вас напали!',r.n+' победил вас: −'+fmtC(lost)+' драконов, −'+fmtC(eg)+' яиц.',curseTxt,5500);
  }else{
    addLog('Вы отбили атаку игрока '+r.n);needRender=true;bigMsg('def','Атака отбита','Игрок '+r.n+' напал на вас, но ваши защитники выстояли.');
  }
}
function endSeason(){
  const b=S.rivals[0],win=S.deadAt>(b?b.deadAt:0);
  const rank=win?1:2,stars=win?1:0,gold=win?1500:300;
  const pct=PRIZE[rank-1]||0,prize=Math.floor(Math.max(0,S.bank)*pct/100);
  S.stars+=stars;S.gold+=gold;S.wings+=prize;S.bank-=prize;

/* ================= действия игрока ================= */
function hatch(silent){
  if(effEra()===3){if(!silent)toast('В 3 эре яйца выращивать нельзя');return;}
  const e=Math.floor(S.eggs);if(e<1)return;
  const g=Math.floor(e*(1-HATCH_LOSS)),f=campShare(),toCamp=Math.floor(g*f),mine=g-toCamp;
  S.dragons+=mine;S.camp+=toCamp;S.eggs-=e;S.st.grown+=mine;
  if(!silent)toast('Выращено драконов: +'+fmtC(mine)+(toCamp>0?', в лагерь отдано '+fmtC(toCamp)+' ('+Math.round(f*100)+'%)':''));

function sellEggs(){
  const e=Math.floor(S.eggs);if(e<1)return;

}
function pickTargets(){
  const c=S.rivals.filter(r=>!r.dead&&!botHas('cloak')).slice();
  for(let i=c.length-1;i>0;i--){const j=rnd(i+1),t=c[i];c[i]=c[j];c[j]=t;}
  ui.targets=c.slice(0,8).map(r=>r.id);ui.pop=null;
}
const rid=id=>S.rivals.find(r=>r.id===id);
function attack(id){
  const r=rid(id);if(!r)return;
  if(!canAtk()){toast('Атаки доступны только во 2 эре');return;}
  if(r.dead){toast('Бот уже погиб');return;}
  if(botHas('cloak')){toast('Плащ невидимости скрыл врага');return;}
  if(on(S.atkAt)){toast('Атака перезаряжается');return;}
  if(on(r.imm)){toast('У игрока иммунитет');return;}
  if(S.hunters<1){toast('Сначала купите охотников');return;}
  const ap=S.hunters*atkMult(),dp=rD(r),claws=A('claws'),tot=ap+dp,share=tot>0?ap/tot:1;
  S.atkAt=S.gt+rechMs();
  S.hunters=Math.floor(S.hunters*(1-0.4*(1-share)));
  r.dr*=1-0.4*share;
  if(ap>dp||claws){
    const sh=claws?1:share;
    const loot=Math.max(1,Math.floor(r.d*0.16*sh)),eg=Math.floor((r.eggs||0)*(claws?1:0.5*sh));
    r.d-=loot;S.dragons+=loot;r.eggs=(r.eggs||0)-eg;S.eggs+=eg;r.imm=S.gt+IMM_DUR;
    S.st.wins++;S.war.a+=1;
    const m='Победа над '+r.n+': +'+fmtC(loot)+' драконов, +'+fmtC(eg)+' яиц'+(claws?' (Когти дракона)':'');addLog(m);toast(m);
  }else{
    const m='Поражение от '+r.n+': потеряно '+Math.round(0.4*(1-share)*100)+'% охотников';addLog(m);toast(m);
  }
}
function skipAtk(){if(S.seals<1||!on(S.atkAt))return;S.seals--;S.atkAt=0;toast('Время ожидания пропущено');}
function curse(id,k){
  const r=rid(id),cu=CURSES[k];if(!r||!cu||!(S.inv[k]>0))return;
  S.inv[k]--;
  if(r.inv[cu.t]>0){r.inv[cu.t]=0;toast('«'+cu.n+'»: у '+r.n+' снят буст');}
  else{r.deb[cu.t]=S.gt+DEB_DUR;toast('«'+cu.n+'» наложена на '+r.n);}
  ui.pop=null;
}
function exterminate(id,kind,byCharge){
  const r=rid(id);if(!r)return;
  if(byCharge){if(!(S.ch.ext>0))return;S.ch.ext--;}
  else{if(S.gold<EXT_GOLD)return;S.gold-=EXT_GOLD;}
  if(kind==='dragons')r.d*=0.3;else if(kind==='hunters')r.hr*=0.3;else r.dr*=0.3;
  toast('Истребление: у '+r.n+' уничтожено 70%');ui.pop=null;
}
function useCharge(k){
  if(!(S.ch[k]>0))return;
  if(k==='rev'){S.ch.rev--;S.chu.rev++;toast('Заряд Возрождения: рождаемость ×3 до конца сезона (итого ×'+fmtC(Math.pow(3,S.chu.rev))+')');}
  else if(k==='sav'||k==='agr'){
    if(S.chu[k]>0){toast('Этот заряд уже применён в этом сезоне');return;}
    S.ch[k]--;S.chu[k]=1;toast(k==='sav'?'Заряд Спасения: защита ×3 до конца сезона':'Заряд Агрессии: атака ×3 до конца сезона');
  }
  else if(k==='ext'){ui.tab='fight';ui.fsub='atk';ui.panel=null;ui.sub=null;ui.confirm='';render();window.scrollTo(0,0);toast('Выберите игрока и нажмите «Истребить»');}
  else if(k==='res')toast('Воскрешение сработает после вашей гибели');
}
const aliveOthers=()=>S.rivals.filter(r=>!r.dead).length;
function revive(){
  if(!S.dead||S.breakUntil)return;
  if(!(S.ch.res>0)){toast('Нет заряда Воскрешения');return;}
  if(aliveOthers()<=3){toast('Воскреснуть можно, когда в игре больше 3 живых игроков');return;}
  S.ch.res--;S.dead=false;S.deadAt=0;S.dAt=0;S.dragons=100;S.eggs=0;
  addLog('Вы воскресли благодаря заряду Воскрешения.');toast('Вы воскресли: 100 драконов');
}
function giveRw(rw){
  if(rw.g)S.gold+=rw.g;if(rw.s)S.stars+=rw.s;if(rw.sl)S.seals+=rw.sl;if(rw.t)S.tix+=rw.t;if(rw.w)S.wings+=rw.w;
}
function rwText(rw){
  const a=[];if(rw.g)a.push(fmtC(rw.g)+' золота');if(rw.s)a.push(rw.s+' звёзд');if(rw.sl)a.push(rw.sl+' печатей');if(rw.t)a.push(rw.t+' билета');if(rw.w)a.push(fmtC(rw.w)+' Даров');
  return a.join(', ');
}
function openBox(){
  if(S.tix<1)return;S.tix--;S.st.box++;
  const r=Math.random()*100;let m;
  if(r<45){const n=500+rnd(1500);S.wings+=n;m='Дары небес: +'+fmtC(n);}
  else if(r<80){const n=(2+rnd(5))*100;S.gold+=n;m='Золото: +'+n;}
  else if(r<88){const n=1+rnd(3);S.seals+=n;m='Печати времени: +'+n;}
  else if(r<98){const k=Object.keys(ITEM)[rnd(12)];giveItem(k);m=ITEM[k].n+' (в инвентаре)';}
  else{S.gold+=2000;m='Золото: +2000';}
  ui.boxMsg=m;toast(m);
}
function claimDaily(){
  const today=dstr(new Date()),y=dstr(new Date(Date.now()-864e5));
  if(S.daily.last===today)return;
  S.daily.streak=S.daily.last===y?S.daily.streak+1:1;S.daily.last=today;
  const rw=DAILY[(S.daily.streak-1)%7];giveRw(rw);toast('Награда дня: '+rwText(rw));
}

function createClan(){

/* ================= сохранение: localStorage + Telegram CloudStorage ================= */
const CS=(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9'))?TG.CloudStorage:null;
const CHUNK=3000,CKEY='dn8_';
let cloudOK=false,cloudBusy=false,cloudAgain=false,cloudLast=0,cloudDirty=false,cloudFails=0,cloudPrevN=0;
const csCall=(fn,...a)=>new Promise((res,rej)=>{try{CS[fn](...a,(e,v)=>e?rej(new Error(String(e))):res(v));}catch(e){rej(e);}});
function splitChunks(str){ // режем по 3000 символов (лимит Telegram 4096), не разрывая суррогатные пары
  const out=[];let i=0;
  while(i<str.length){let e=Math.min(str.length,i+CHUNK);if(e<str.length){const c=str.charCodeAt(e-1);if(c>=0xD800&&c<=0xDBFF)e--;}out.push(str.slice(i,e));i=e;}
  return out.length?out:['{}'];
}
function persist(){
  step();if(needRender){needRender=false;render();}
  S.savedAt=Date.now();saveLocal();cloudDirty=true;cloudWrite();
}
async function cloudWrite(force){
  if(!cloudOK||!cloudDirty)return;
  if(!force&&Date.now()-cloudLast<15000)return;
  if(cloudBusy){cloudAgain=true;return;}
  cloudBusy=true;cloudDirty=false;
  try{
    const parts=splitChunks(JSON.stringify(S)),n=parts.length,items={};
    parts.forEach((p,i)=>{items[CKEY+i]=p;});
    await csCall('setItems',items);
    await csCall('setItem',CKEY+'meta',JSON.stringify({n:n,t:S.savedAt})); // метка пишется последней: частично записанное сохранение не прочитается
    if(cloudPrevN>n){const old=[];for(let i=n;i<cloudPrevN;i++)old.push(CKEY+i);await csCall('removeItems',old);}
    cloudPrevN=n;cloudLast=Date.now();cloudFails=0;
  }catch(e){cloudDirty=true;cloudFails++;if(cloudFails>=5)cloudOK=false;}
  cloudBusy=false;
  if(cloudAgain){cloudAgain=false;cloudWrite();}
}
async function initCloud(){
  if(!CS)return;
  try{
    const m=await Promise.race([csCall('getItem',CKEY+'meta'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
    if(m){
      const meta=JSON.parse(m);cloudPrevN=meta.n||0;
      if((meta.t||0)>(S.savedAt||0)&&meta.n>0){
        const keys=[];for(let i=0;i<meta.n;i++)keys.push(CKEY+i);
        const vals=await csCall('getItems',keys);
        const rem=migrate(JSON.parse(keys.map(k=>vals[k]||'').join('')));
        S=rem;syncUser();ui.targets=[];step();render();
      }
    }
    cloudOK=true;cloudDirty=true;dirty=true;
  }catch(e){cloudOK=false;}
}

const tk=i=>i===0?S.tix:(S.lbt&&S.lbt[i]||0);

function lbAmt(s){const m=/^([\d.,]+)\s*(к|млн|млрд)?/.exec(s);if(!m)return 0;return parseFloat(m[1].replace(',','.'))*({'к':1e3,'млн':1e6,'млрд':1e9}[m[2]]||1);}
// выдача награды игроку; возвращает, куда она попала
function lbGive(it){
  let m;
  const boosts=n=>Object.keys(BOOSTS).forEach(k=>{S.own[k]=(S.own[k]||0)+n;});
  const curses=n=>Object.keys(CURSES).forEach(k=>{S.inv[k]=(S.inv[k]||0)+n;});
  if(/лутбокс$/.test(it)){const L=['серебряный','золотой','платиновый','изумрудный'].findIndex(w=>it.includes(w))+1;addTk(L,1);return 'Билет добавлен в Dragon Box';}
  if(m=/(\d+)\s+печат/.exec(it)){S.seals+=Number(m[1]);return 'Печати зачислены на счёт';}
  if(/ баланса$/.test(it)||/ серебра$/.test(it)){S.wings+=lbAmt(it);return 'Дары небес зачислены на счёт';}
  if(/ золота$/.test(it)){S.gold+=lbAmt(it);return 'Dra-Coins зачислены на счёт';}
  if(m=/бустов и 6 порч [ХX](\d+)/.exec(it)){boosts(Number(m[1]));curses(Number(m[1]));return 'Бусты и порчи добавлены в инвентарь';}
  if(m=/Все 6 бустов [ХX](\d+)/.exec(it)){boosts(Number(m[1]));return 'Бусты добавлены в инвентарь';}
  if(m=/Все 6 порч [ХX](\d+)/.exec(it)){curses(Number(m[1]));return 'Порчи добавлены в инвентарь';}
  if(m=/^(\d+) шт\. одного из 12/.exec(it)){const n=Number(m[1]),k=Object.keys(ITEM)[rnd(12)];if(BOOSTS[k])S.own[k]=(S.own[k]||0)+n;else S.inv[k]=(S.inv[k]||0)+n;return ITEM[k].n+' ×'+n+' в инвентаре';}
  if(m=/^Заряд (\S+)/.exec(it)){const k=LB_CHG[m[1]];if(k){if(!S.ch)S.ch={};S.ch[k]=(S.ch[k]||0)+1;return 'Заряд добавлен в инвентарь';}}
  return '';
}

function sealN(){
  let n=Math.round(Math.pow(10,ui.sealPct*5/100));
  if(n>=100){const m=Math.pow(10,String(n).length-2);n=Math.round(n/m)*m;}
  return Math.max(1,n);
}
function sealPrice(n){return Math.round(n*(n>=10?700:n>=3?2500/3:1000));}

function act(a,el){
  const d=el.dataset,id=Number(d.id);
  if(S.breakUntil)return;
  if(S.dead&&!['tab','sub','panel','fsub','war','refresh','pop','ssub','invf','qty','hint','clog','revive'].includes(a)){toast('Вы погибли: ждите конца сезона');return;}

    case 'tab':ui.tab=d.t;ui.panel=null;ui.sub=null;ui.pop=null;ui.warOpen=false;ui.confirm='';render();window.scrollTo(0,0);return;
    case 'sub':ui.sub=d.v||null;render();window.scrollTo(0,0);return;
    case 'panel':if(d.p==='box'){lbOpen();return;}ui.panel=d.p||null;if(ui.panel==='season'||!ui.panel)dirty=true;render();window.scrollTo(0,0);return;
    case 'hint':S.hint=1;commit();return;
    case 'qty':ui.qty=d.v==='max'?'max':Number(d.v);render();return;
    case 'buy':if(buyUnit(d.k))commit();else renderLive();return;
    case 'hatch':hatch(false);commit();return;
    case 'sell':
      if(ui.confirm!=='sell'){ui.confirm='sell';clearTimeout(confTimer);confTimer=setTimeout(()=>{ui.confirm='';render();},3500);toast('Нажмите «Продать» ещё раз: улетит '+Math.round(SELL_LOSS*100)+'% драконов');return;}
      ui.confirm='';sellEggs();commit();return;
    case 'sac':sacrifice();commit();return;
    case 'gbu':changeGB(true);commit();return;
    case 'gbd':changeGB(false);commit();return;
    case 'cbu':changeCat(true);commit();return;
    case 'cbd':changeCat(false);commit();return;
    case 'rent':rentArt(d.k);commit();return;
    case 'gtoggle':toggleGB(d.k);commit();return;
    case 'share':{const l=inviteLink();if(!l)return;const u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('Играй со мной в Драконье Гнездо!');try{TG.openTelegramLink(u);}catch(e){window.open(u,'_blank');}return;}
    case 'camp':camp();commit();return;
    case 'botoggle':S.botOn=S.botOn!==0?0:1;toast(S.botOn?'Бот драконов запущен':'Бот драконов остановлен: яйца больше не выращиваются автоматически');commit();return;
    case 'invuse':useItem(d.k);commit();return;
    case 'campskip':campSkip();commit();return;
    case 'gboost':useBoost(d.k);commit();return;
    case 'sboost':useStarBoost(d.k);commit();return;
    case 'cboost':useClanBoost(d.k);commit();return;
    case 'buycoins':{const n=Number(d.n),c=n*100;if(S.wings<c){toast('Не хватает DF');return;}spend(c);S.gold+=n;toast('Dra-Coins: +'+fmtC(n));commit();return;}
    case 'exbuy':exBuy();commit();return;
    case 'exsell':exSell();commit();return;
    case 'fsub':ui.fsub=d.v;ui.pop=null;render();return;
    case 'war':ui.warOpen=!ui.warOpen;render();return;
    case 'refresh':pickTargets();render();return;
    case 'atk':attack(id);commit();return;
    case 'atkskip':skipAtk();commit();return;
    case 'pop':ui.pop=(ui.pop&&ui.pop.id===id&&ui.pop.kind===d.v)?null:{id:id,kind:d.v};render();return;
    case 'curse':curse(id,d.k);commit();return;
    case 'ext':exterminate(id,d.k,d.c==='1');commit();return;
    case 'chuse':useCharge(d.k);commit();return;
    case 'revive':revive();commit();return;
    case 'join':joinClan(Number(d.i));commit();return;
    case 'leave':S.clan=-1;toast('Вы вышли из клана');commit();return;
    case 'mkclan':createClan();commit();return;
    case 'chat':toast('Клановый чат недоступен в этой версии');return;
    case 'clog':ui.warOpen=ui.warOpen==='log'?false:'log';render();return;
    case 'daily':claimDaily();commit();return;
    case 'pay':ui.pay=d.v;render();return;
    case 'ssub':ui.ssub=d.v;render();return;
    case 'buystars':if(S.gold>=Number(d.g)){S.gold-=Number(d.g);S.stars+=Number(d.n);toast('Звёзды: +'+d.n);commit();}return;
    case 'buytix':if(S.gold>=Number(d.g)){S.gold-=Number(d.g);S.tix+=Number(d.n);toast('Билеты: +'+d.n);commit();}return;
    case 'buyitem':buyItem(d.k);commit();return;
    case 'buysealn':{
      const n=sealN(),c=sealPrice(n);
      if(S.gold<c){toast('Не хватает Dra-Coins');return;}
      S.gold-=c;S.seals+=n;toast('Печати времени: +'+fmt(n));commit();lbSync();return;}
    case 'buylb':{
      const i=Number(d.i),c=LB_PRICE[i];
      if(!(c>0))return;
      if(S.seals<c){toast('Не хватает печатей времени');return;}
      S.seals-=c;addTk(i,1);toast('Билет «'+LB_NAMES[i]+'»: +1');commit();lbSync();return;}
    case 'gotoseals':lbClose();ui.panel=null;ui.tab='shop';ui.ssub='sp';render();window.scrollTo(0,0);return;
    case 'buyseal':{
      const n=Number(d.n),gold=ui.pay==='gold',c=Number(gold?d.g:d.s);
      if(gold){if(S.gold<c)return;S.gold-=c;}else{if(S.stars<c)return;S.stars-=c;}
      S.seals+=n;toast('Печати времени: +'+n);commit();return;}
    case 'invf':ui.inv=d.v;render();return;
    case 'claim':{
      const t=TASKS.find(x=>x.id===d.id);
      if(t&&!S.tc[t.id]&&t.get()>=t.n){S.tc[t.id]=1;giveRw(t.rw);toast('Награда: '+rwText(t.rw));commit();}
      return;}
    case 'copy':{
      const txt=inviteLink()||String(S.pid);
      try{navigator.clipboard.writeText(txt).then(()=>toast('Код скопирован'),()=>toast('Код: '+txt));}catch(e){toast('Код: '+txt);}
      return;}
    case 'openbox':openBox();commit();return;
    case 'gotoshop':ui.panel=null;ui.tab='shop';ui.ssub='tix';render();window.scrollTo(0,0);return;
    case 'buyart':{
      const ar=ARTS[d.k];if(!ar||S.arts[d.k]||S.altar<ar.cost)return;
      S.altar-=ar.cost;S.arts[d.k]=1;toast('Артефакт получен: '+ar.n);commit();return;}
    case 'speed':S.speed=Number(d.v);commit();return;
    case 'reset':
      if(ui.confirm!=='reset'){ui.confirm='reset';clearTimeout(confTimer);confTimer=setTimeout(()=>{ui.confirm='';if(ui.panel==='set')render();},3500);render();return;}
      ui.confirm='';resetAll();persist();render();return;
  }
}
